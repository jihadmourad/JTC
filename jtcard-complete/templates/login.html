<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - JTCard Platform</title>
    <meta name="description" content="Sign in to your JTCard account to manage your digital business cards.">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="{{ url_for('index') }}" class="logo" style="text-decoration: none; margin-bottom: var(--space-6); display: inline-flex; align-items: center;">
                    <div class="logo-icon" style="margin-right: var(--space-3);">JT</div>
                    JTCard
                </a>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your account to continue</p>
            </div>
            
            <!-- Social Login Buttons -->
            <div class="social-buttons">
                <button class="btn-social btn-google">
                    <i class="fab fa-google"></i>
                    Continue with Google
                </button>
                <button class="btn-social btn-linkedin">
                    <i class="fab fa-linkedin"></i>
                    Continue with LinkedIn
                </button>
            </div>
            
            <div style="text-align: center; margin: var(--space-6) 0; color: var(--gray-500); font-size: var(--font-size-sm); position: relative;">
                <span style="background: white; padding: 0 var(--space-4);">or sign in with email</span>
                <div style="position: absolute; left: 0; right: 0; height: 1px; background: var(--gray-200); top: 50%; z-index: -1;"></div>
            </div>
            
            <form class="auth-form" id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">
                        <i class="fas fa-envelope"></i>
                        Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6);">
                    <label style="display: flex; align-items: center; gap: var(--space-2); font-size: var(--font-size-sm); color: var(--gray-600);">
                        <input type="checkbox" name="remember" style="margin: 0;">
                        Remember me
                    </label>
                    <a href="#" style="font-size: var(--font-size-sm); color: var(--primary-600); text-decoration: none;">
                        Forgot password?
                    </a>
                </div>
                
                <div id="error-message" class="error-message" style="display: none; color: var(--error-500); margin-bottom: var(--space-4); text-align: center; font-size: var(--font-size-sm); background: rgba(239, 68, 68, 0.1); border: 1px solid var(--error-500); border-radius: var(--radius-base); padding: var(--space-3);"></div>
                
                <button type="submit" class="btn btn-primary w-full" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </button>
            </form>
            
            <div class="auth-footer">
                <p style="color: var(--gray-600); font-size: var(--font-size-sm); text-align: center;">
                    Don't have an account? 
                    <a href="{{ url_for('signup') }}" style="color: var(--primary-600); text-decoration: none; font-weight: 600;">
                        Sign up for free
                    </a>
                </p>
            </div>
        </div>
    </div>
    
    <style>
        .form-label {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        
        .form-label i {
            color: var(--primary-600);
            width: 16px;
        }
        
        .error-message {
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .loading {
            position: relative;
        }
        
        .loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const form = e.target;
            const formData = new FormData(form);
            const loginBtn = document.getElementById('login-btn');
            const errorMessage = document.getElementById('error-message');
            
            // Show loading state
            loginBtn.disabled = true;
            loginBtn.classList.add('loading');
            loginBtn.innerHTML = '<span style="opacity: 0;">Signing In...</span>';
            errorMessage.style.display = 'none';
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: formData.get('email'),
                        password: formData.get('password'),
                        remember: formData.get('remember') === 'on'
                    })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    // Success - redirect to dashboard
                    loginBtn.innerHTML = '<i class="fas fa-check"></i> Success! Redirecting...';
                    loginBtn.style.background = 'var(--success-500)';
                    
                    setTimeout(() => {
                        window.location.href = result.redirect || '/dashboard';
                    }, 1000);
                } else {
                    // Error - show message
                    throw new Error(result.error || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                
                // Show error message
                errorMessage.textContent = error.message || 'An error occurred during login';
                errorMessage.style.display = 'block';
                
                // Reset button
                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                loginBtn.style.background = '';
                
                // Shake animation for error
                form.style.animation = 'shake 0.5s ease-in-out';
                setTimeout(() => {
                    form.style.animation = '';
                }, 500);
            }
        });
        
        // Social login handlers
        document.querySelector('.btn-google').addEventListener('click', () => {
            // Implement Google OAuth
            alert('Google login would be implemented here');
        });
        
        document.querySelector('.btn-linkedin').addEventListener('click', () => {
            // Implement LinkedIn OAuth
            alert('LinkedIn login would be implemented here');
        });
        
        // Focus on email field
        document.getElementById('email').focus();
        
        // Handle Enter key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !document.getElementById('login-btn').disabled) {
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
